      const [geminiKeyInput, setGeminiKeyInput] = useState(CONFIG.GEMINI_API_KEY);
      const [openaiKeyInput, setOpenaiKeyInput] = useState(CONFIG.OPENAI_API_KEY);
      const [mobileSidebarOpen, setMobileSidebarOpen] = useState(false);
      const [toastMsg, setToastMsg] = useState(null);

      // Refs
      const chatBottomRef = useRef(null);
      const inputAreaRef = useRef(null);
      const speechRecognizerRef = useRef(null);
      const speechDebounceRef = useRef(null);

      // Active Alert Info
      const activeAlert = useMemo(() => evaluateAlertStatus(weather, weatherAlerts, forecast, selectedLanguage), [weather, weatherAlerts, forecast, selectedLanguage]);

      // Show temporary toast notification
      const showToast = useCallback((msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3000);
      }, []);

      // --- Fetch Weather Master Function ---
      const fetchWeatherData = useCallback(async (lat, lng, cityName) => {
        setIsLoadingWeather(true);
        setIsFallbackMode(false);

        let curWeather = null;
        let hourlyList = [];
        let dailyList = [];
        let alertsList = [];

        // 1. Try Google Weather API
        try {
          const [curRes, hourlyRes, dailyRes, alertsRes] = await Promise.all([
            fetchGoogleCurrentWeather(lat, lng),
            fetchGoogleHourlyForecast(lat, lng),
            fetchGoogleDailyForecast(lat, lng),
            fetchGoogleWeatherAlerts(lat, lng)
          ]);

          curWeather = normalizeGoogleWeather(curRes, cityName, alertsRes);
          hourlyList = normalizeGoogleHourly(hourlyRes);
          dailyList = normalizeGoogleDaily(dailyRes);
          alertsList = alertsRes;
        } catch (googleErr) {
          console.warn('Google Weather API request encountered an issue; seamlessly activating Open-Meteo fallback:', googleErr);
          try {
            const meteoData = await fetchOpenMeteoData(lat, lng);
            curWeather = normalizeOpenMeteoWeather(meteoData, cityName);
            hourlyList = normalizeOpenMeteoHourly(meteoData);
            dailyList = normalizeOpenMeteoDaily(meteoData);
            setIsFallbackMode(true);
          } catch (meteoErr) {
            console.error('All weather providers failed:', meteoErr);
            showToast('⚠️ Unable to connect to weather satellites. Using cached view.');
            setIsLoadingWeather(false);
            return;
          }
        }

        if (curWeather) {
          curWeather.alerts = alertsList;
          setWeather(curWeather);
          setForecast({ hourly: hourlyList, daily: dailyList });
          setWeatherAlerts(alertsList);
          setLastUpdatedTime(new Date());
          setAlertBannerDismissed(false);
          setRefreshCountdown(600);
        }
        setIsLoadingWeather(false);
      }, [showToast]);

      // ---- GPS Auto-Detect Helper ----
      const runGpsDetect = useCallback(async () => {
        if (!navigator.geolocation) {
          setGpsState('unsupported');
          fetchWeatherData(currentLoc.lat, currentLoc.lng, currentLoc.city);
          return;
        }
        setGpsState('waiting');
        setIsDetectingLoc(true);
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            const { latitude, longitude } = pos.coords;
            const geoInfo = await reverseGeocodeCoords(latitude, longitude);
            const cityName = typeof geoInfo === 'string' ? geoInfo : (geoInfo?.city || 'Your Location');
            const stateOrDesc = geoInfo?.subdivision || '';
            setCurrentLoc({
              city: cityName,
              lat: latitude,
              lng: longitude,
              isGps: true,
              detail: stateOrDesc
            });
            setSearchHistory(prev => {
              const filtered = prev.filter(c => c.toLowerCase() !== cityName.toLowerCase());
              return [cityName, ...filtered].slice(0, 5);
            });
            await fetchWeatherData(latitude, longitude, cityName);
            setGpsState('granted');
            setIsDetectingLoc(false);
            showToast(`📍 GPS Detected: ${cityName}${stateOrDesc ? ' (' + stateOrDesc + ')' : ''}`);
          },
          (err) => {
            console.warn('GPS auto-detect failed:', err);
            setGpsState('denied');
            setIsDetectingLoc(false);
            // Fallback: load weather for default New Delhi
            fetchWeatherData(currentLoc.lat, currentLoc.lng, currentLoc.city);
            if (err.code !== 1) { // code 1 = user denied (silent)
              showToast('⚠️ GPS unavailable. Showing New Delhi by default.');
            }
          },
          { timeout: 12000, maximumAge: 300000, enableHighAccuracy: true }
        );
      }, [fetchWeatherData, showToast, currentLoc.lat, currentLoc.lng, currentLoc.city]);

      // Initial Mount — show GPS prompt overlay; if unsupported, load default
      useEffect(() => {
        if (gpsState === 'unsupported') {
          fetchWeatherData(currentLoc.lat, currentLoc.lng, currentLoc.city);
        }
        // When gpsState === 'prompt', the overlay is displayed and we wait for user action.
        // The overlay buttons call runGpsDetect() or skip to default.
      }, []); // eslint-disable-line react-hooks/exhaustive-deps

      // Auto-populate default compare city on first compare open if empty
      useEffect(() => {
        if (isCompareOpen && !compareWeatherData && !compareCityQuery) {
          const defaultCompare = currentLoc.city.toLowerCase().includes('mumbai') ? 'New Delhi' : 'Mumbai';
          setCompareCityQuery(defaultCompare);
          handleFetchCompareCity(defaultCompare);
        }
      }, [isCompareOpen]);

      // 10-Minute Auto-Refresh Countdown
      useEffect(() => {
        const timer = setInterval(() => {
          setRefreshCountdown(prev => {
            if (prev <= 1) {
              fetchWeatherData(currentLoc.lat, currentLoc.lng, currentLoc.city);
              return 600;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [currentLoc, fetchWeatherData]);

      // Chat Auto-Scroll
      useEffect(() => {
        chatBottomRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, isTyping]);

      // Global Keyboard Shortcuts
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.ctrlKey && (e.key === 'm' || e.key === 'M')) {
            e.preventDefault();
            handleToggleMicrophone();
          }
          if (e.key === 'Escape') {
            if (isCompareOpen) setIsCompareOpen(false);
            else if (isSettingsOpen) setIsSettingsOpen(false);
            else {
              setTextInput('');
              inputAreaRef.current?.focus();
            }
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isCompareOpen, isSettingsOpen, micStatus]);

      // Location Search
      const handleExecuteSearch = async (targetCity) => {
        if (!targetCity || !targetCity.trim()) return;
        const clean = targetCity.trim();
        const geo = await geocodeAddress(clean);

        if (geo) {
          setCurrentLoc({
            city: geo.city,
            lat: geo.lat,
            lng: geo.lng,
            isGps: false,
            detail: geo.formattedAddress?.split(',')[1]?.trim() || ''
          });
          setSearchInput('');
          setSearchHistory(prev => {
            const filtered = prev.filter(c => c.toLowerCase() !== geo.city.toLowerCase());
            return [geo.city, ...filtered].slice(0, 5);
          });
          fetchWeatherData(geo.lat, geo.lng, geo.city);
          setMobileSidebarOpen(false);
        } else {
          showToast(`❌ Could not locate "${clean}". Please verify spelling.`);
        }
      };

      // Detect Browser Location (manual re-trigger from sidebar button)
      const handleDetectLocation = () => {
        if (!navigator.geolocation) {
          showToast('Geolocation is not supported by your browser.');
          return;
        }
        if (gpsState === 'prompt') {
          // Re-show the overlay so user can allow
          setGpsState('prompt');
          return;
        }
        setIsDetectingLoc(true);
        setGpsState('waiting');
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            const { latitude, longitude } = pos.coords;
            const geoInfo = await reverseGeocodeCoords(latitude, longitude);
            const cityName = typeof geoInfo === 'string' ? geoInfo : (geoInfo?.city || 'Your Location');
            const stateOrDesc = geoInfo?.subdivision || '';
            setCurrentLoc({
              city: cityName,
              lat: latitude,
              lng: longitude,
              isGps: true,
              detail: stateOrDesc
            });
            setSearchHistory(prev => {
              const filtered = prev.filter(c => c.toLowerCase() !== cityName.toLowerCase());
              return [cityName, ...filtered].slice(0, 5);
            });
            fetchWeatherData(latitude, longitude, cityName);
            setGpsState('granted');
            setIsDetectingLoc(false);
            setMobileSidebarOpen(false);
            showToast(`📍 Location updated: ${cityName}${stateOrDesc ? ' (' + stateOrDesc + ')' : ''}`);
          },
          (err) => {
            console.warn('Geolocation denied/error:', err);
            showToast('⚠️ Location access denied. Please enter city manually.');
            setGpsState('denied');
            setIsDetectingLoc(false);
          },
          { timeout: 10000, maximumAge: 300000, enableHighAccuracy: true }
        );
      };

      // --- Chat Messaging Engine ---
      const handleSendMessage = async (textToSend) => {
        const query = (textToSend || textInput).trim();
        if (!query || isSending) return;

        const userMsg = {
          role: 'user',
          content: query,
          time: getCurrentTimestamp(),
          id: Date.now() + Math.random()
        };

        setMessages(prev => [...prev, userMsg]);
        setTextInput('');
        if (inputAreaRef.current) inputAreaRef.current.style.height = 'auto';

        setIsSending(true);
        setIsTyping(true);

        // Small realistic typing delay
        await new Promise(r => setTimeout(r, 250));

        let generatedAnswer = '';
        const weatherSummary = weather ? formatWeatherForPrompt(weather, forecast) : 'Weather conditions unavailable.';
        const systemPrompt = buildSystemPrompt(selectedPersona, selectedLanguage, weatherSummary);
        const historyForClaude = [...messages.slice(-8), userMsg].map(m => ({ role: m.role, content: m.content }));

        try {
          if (CONFIG.CLAUDE_API_KEY) {
            generatedAnswer = await executeClaudeRequest(systemPrompt, historyForClaude);
          } else {
            throw new Error('Claude API key not provided in CONFIG');
          }
        } catch (apiErr) {
          console.info('Using high-fidelity local persona engine:', apiErr.message);
          generatedAnswer = generateSmartLocalResponse(selectedPersona, selectedLanguage, weather, query, forecast);
        }

        const aiMsg = {
          role: 'assistant',
          content: generatedAnswer,
          query: query,
          time: getCurrentTimestamp(),
          id: Date.now() + Math.random(),
          source: isFallbackMode ? 'open-meteo' : 'google'
        };

        setMessages(prev => [...prev, aiMsg]);
        setIsTyping(false);
        setIsSending(false);
      };

      // Voice STT Controller
      const handleToggleMicrophone = () => {
        if (micStatus === 'recording') {
          speechRecognizerRef.current?.stop();
          setMicStatus('default');
          return;
        }

        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          showToast('🎤 Web Speech API not supported in this browser. Try Chrome/Edge.');
          return;
        }

        const recognition = new SpeechRec();
        recognition.lang = LANG_CODES[selectedLanguage] || 'hi-IN';
        recognition.continuous = false;
        recognition.interimResults = true;
        speechRecognizerRef.current = recognition;

        recognition.onstart = () => {
          setMicStatus('recording');
        };

        recognition.onresult = (e) => {
          let liveTranscript = '';
          for (let i = 0; i < e.results.length; i++) {
            liveTranscript += e.results[i][0].transcript;
          }
          setTextInput(liveTranscript);

          const isFinal = e.results[e.results.length - 1].isFinal;
          if (isFinal) {
            setMicStatus('processing');
            clearTimeout(speechDebounceRef.current);
            speechDebounceRef.current = setTimeout(() => {
              handleSendMessage(liveTranscript);
              setMicStatus('default');
            }, 1500);
          }
        };

        recognition.onerror = (e) => {
          console.warn('Speech recognition error:', e.error);
          setMicStatus('default');
        };

        recognition.onend = () => {
          if (micStatus === 'recording') setMicStatus('default');
        };

        recognition.start();
      };

      // TTS Audio Controller
      const handleToggleListen = (msg) => {
        if (activeSpeakingId === msg.id) {
          window.speechSynthesis.cancel();
          setActiveSpeakingId(null);
          return;
        }

        const utterance = triggerTtsSpeech(msg.content, selectedLanguage);
        if (utterance) {
          setActiveSpeakingId(msg.id);
          utterance.onend = () => setActiveSpeakingId(null);
          utterance.onerror = () => setActiveSpeakingId(null);
        }
      };

      // Copy to Clipboard
      const handleCopyText = (msg) => {
        navigator.clipboard.writeText(msg.content)
          .then(() => showToast('📋 Copied to clipboard!'))
          .catch(() => showToast('Failed to copy.'));
      };

      // Share Weather Report
      const handleShareWeather = (msg) => {
        const sharePayload = `WeatherGPT (${currentLoc.city}):\n${msg.content}\n\n[Powered by WeatherGPT • Smart India Hackathon 2026]`;
        navigator.clipboard.writeText(sharePayload)
          .then(() => showToast('📤 Weather report copied for sharing!'))
          .catch(() => showToast('Failed to copy share text.'));
      };

      // Instant Message Translation to English
      const handleToggleTranslate = async (msg) => {
        if (!msg || !msg.id) return;

        if (translatedMap[msg.id]) {
          setTranslatedMap(prev => {
            const next = { ...prev };
            delete next[msg.id];
            return next;
          });
          return;
        }

        if (CONFIG.CLAUDE_API_KEY) {
          try {
            const trans = await executeClaudeRequest(
              'Translate the following Indian regional weather message to clear English. Output only the translation, no extra commentary.',
              [{ role: 'user', content: msg.content }]
            );
            if (trans && trans.trim()) {
              setTranslatedMap(prev => ({ ...prev, [msg.id]: trans.trim() }));
              return;
            }
          } catch (err) {
            console.info('Claude translation not available, using local engine:', err.message);
          }
        }

        // Smart local English translation fallback using our localized persona engine
        try {
          const userQuery = msg.query || '';
          const engText = generateSmartLocalResponse(selectedPersona, 'english', weather, userQuery || msg.content, forecast);
          setTranslatedMap(prev => ({ ...prev, [msg.id]: engText }));
        } catch (e) {
          console.warn('Translation engine error:', e);
          const w = weather || {};
          const isRainy = (w.condition || '').toLowerCase().includes('rain') || (w.humidity || 0) > 75;
          let basicSummary = `Weather for ${w.city || 'your area'}: ${w.temp || 28}°C, ${w.condition || 'Clear'}.\n` +
            `Humidity: ${w.humidity || 55}% | Wind: ${w.windSpeed || 12} km/h | UV: ${w.uvIndex || 5}\n\n` +
            (isRainy ? '🌧️ Rain is expected — carry an umbrella!' : '😊 Pleasant weather conditions for outdoor activities.');
          setTranslatedMap(prev => ({ ...prev, [msg.id]: basicSummary }));
        }
      };

      // Compare Mode Search with full fallbacks
      const handleFetchCompareCity = async (targetCity) => {
        const query = (targetCity !== undefined ? targetCity : compareCityQuery).trim();
        if (!query) {
          showToast('Please enter a city name to compare.');
          return;
        }

        setIsCompareLoading(true);
        const geo = await geocodeAddress(query);

        if (geo) {
          let compW = null;
          try {
            const curRes = await fetchGoogleCurrentWeather(geo.lat, geo.lng);
            compW = normalizeGoogleWeather(curRes, geo.city, []);
          } catch (gErr) {
            console.warn('Google Weather compare request failed, using Open-Meteo:', gErr);
            try {
              const meteo = await fetchOpenMeteoData(geo.lat, geo.lng);
              compW = normalizeOpenMeteoWeather(meteo, geo.city);
            } catch (mErr) {
              console.error('All compare weather providers failed:', mErr);
            }
          }

          if (compW) {
            setCompareWeatherData(compW);
            showToast(`✅ Comparison loaded for ${compW.city}`);
          } else {
            setCompareWeatherData(null);
            showToast(`Failed to fetch weather for "${geo.city}".`);
          }
        } else {
          showToast(`Could not find "${query}". Try cities like Mumbai, Chennai, Kolkata.`);
        }
        setIsCompareLoading(false);
      };

      // Clear Conversation
      const handleClearConversation = () => {
        setMessages([]);
        setTranslatedMap({});
        window.speechSynthesis.cancel();
        setActiveSpeakingId(null);
        showToast('🗑️ Conversation history cleared.');
      };

      // Auto-height textarea handler
      const handleTextareaInput = (e) => {
        const val = e.target.value;
        if (val.length <= 200) {
          setTextInput(val);
          e.target.style.height = 'auto';
          e.target.style.height = `${Math.min(e.target.scrollHeight, 110)}px`;
        }
      };

      const handleInputKeyDown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSendMessage(textInput);
        }
      };

      // Formatted Refresh Countdown
      const countdownMinutes = Math.floor(refreshCountdown / 60);
      const countdownSeconds = String(refreshCountdown % 60).padStart(2, '0');
      const backgroundTint = weather ? getBackgroundTintClass(weather.condition, weather.isDaytime) : 'clear';

      /* ===== RENDER UI ===== */
      return html`
        <div class="app-wrapper">

          <!-- GPS PERMISSION OVERLAY -->
          ${gpsState === 'prompt' && html`
            <div class="gps-overlay" id="gps-permission-overlay">
              <div class="gps-card">
                <div class="gps-icon-ring">📍</div>
                <h2 class="gps-title">Enable GPS Location</h2>
                <p class="gps-subtitle">
                  WeatherGPT can automatically detect your exact location to show
                  <strong>hyper-local, real-time weather</strong> for where you actually are — no typing needed.
                </p>
                <button
                  id="gps-allow-btn"
                  class="gps-allow-btn"
                  onClick=${() => runGpsDetect()}
                >
                  🎯 Use My GPS Location
                </button>
                <button
                  id="gps-skip-btn"
                  class="gps-deny-btn"
                  onClick=${() => {
                    setGpsState('denied');
                    fetchWeatherData(currentLoc.lat, currentLoc.lng, currentLoc.city);
                  }}
                >
                  Not now — use New Delhi
                </button>
                <p class="gps-privacy-note">
                  🔒 Your location is used only for weather data and is never stored or shared.
                </p>
              </div>
            </div>
          `}

          <!-- GPS WAITING OVERLAY -->
          ${gpsState === 'waiting' && html`
            <div class="gps-overlay" id="gps-waiting-overlay">
              <div class="gps-card">
                <div class="gps-icon-ring">🛰️</div>
                <h2 class="gps-title">Acquiring GPS Signal…</h2>
                <p class="gps-subtitle">
                  Please allow location access in your browser's permission popup.
                  This usually takes just a few seconds.
                </p>
                <div style=${{ display: 'flex', justifyContent: 'center', marginTop: '8px' }}>
                  <div class="gps-detecting-spinner"></div>
                </div>
              </div>
            </div>
          `}

          <!-- Mobile Hamburger Toggle -->
          <button
            class="mobile-nav-toggle"
            id="mobile-nav-toggle"
            onClick=${() => setMobileSidebarOpen(!mobileSidebarOpen)}
            title="Toggle Menu"
          >
            ${mobileSidebarOpen ? '✕' : '☰'}
          </button>

          <!-- Mobile Backdrop Overlay -->
          <div
            class="mobile-backdrop-overlay ${mobileSidebarOpen ? 'active' : ''}"
            onClick=${() => setMobileSidebarOpen(false)}
          />

          <!-- LEFT SIDEBAR -->
          <aside class="sidebar ${mobileSidebarOpen ? 'open' : ''}" id="app-sidebar">
            <!-- Brand -->
            <div class="sidebar-brand">
              <div class="brand-logo-row">
                <span class="brand-icon">⛈️</span>
                <span class="brand-title">WeatherGPT</span>
              </div>
              <div class="brand-tagline">${i18n.tagline}</div>
            </div>

            <!-- Location Section -->
            <div class="sidebar-section">
              <div class="section-heading">${i18n.location}</div>
              <div class="search-box">
                <span class="search-icon">🔍</span>
                <input
                  id="city-search-input"
                  class="location-input"
                  type="text"
                  placeholder=${i18n.searchPlaceholder}
                  value=${searchInput}
                  onInput=${e => setSearchInput(e.target.value)}
                  onKeyDown=${e => e.key === 'Enter' && handleExecuteSearch(searchInput)}
                />
              </div>
              <button
                id="detect-location-btn"
                class="detect-loc-btn ${gpsState === 'granted' ? 'gps-granted' : gpsState === 'denied' ? 'gps-denied' : ''}"
                onClick=${handleDetectLocation}
                disabled=${isDetectingLoc || gpsState === 'waiting'}
                title=${
                  gpsState === 'granted' ? 'GPS Active — click to re-detect' :
                  gpsState === 'denied'  ? 'GPS denied — click to try again'  :
                  gpsState === 'waiting' ? 'Detecting GPS location…' :
                  'Detect my GPS location'
                }
              >
                ${
                  gpsState === 'waiting'  ? i18n.detecting :
                  gpsState === 'granted'  ? ('✅ GPS: ' + currentLoc.city) :
                  gpsState === 'denied'   ? '❌ GPS denied — retry?' :
                  i18n.detectLoc
                }
              </button>
              <div class="current-location-tag">
                <span class="pulse-dot"></span>
                <div class="current-location-info">
                  <div class="current-location-name">
                    <span>${currentLoc.city}</span>
                    ${currentLoc.isGps && html`<span class="gps-active-badge">GPS</span>`}
                  </div>
                  ${currentLoc.lat && currentLoc.lng && html`
                    <div class="current-location-coords">
                      <span>${currentLoc.lat.toFixed(2)}°N, ${currentLoc.lng.toFixed(2)}°E</span>
                      ${currentLoc.detail && html`<span> · ${currentLoc.detail}</span>`}
                    </div>
                  `}
                </div>
              </div>
              ${searchHistory.length > 0 && html`
                <div class="search-history-chips">
                  ${searchHistory.map(city => html`
                    <span
                      key=${city}
                      class="history-chip"
                      onClick=${() => handleExecuteSearch(city)}
                      title="Switch to ${city}"
                    >
                      ${city}
                    </span>
                  `)}
                </div>
              `}
            </div>

            <!-- Persona Section -->
            <div class="sidebar-section">
              <div class="section-heading">${i18n.iAmA}</div>
              <div class="persona-grid">
                ${Object.entries(PERSONA_CONFIG).map(([key, config]) => html`
                  <button
                    key=${key}
                    id="persona-${key}"
                    class="persona-card ${selectedPersona === key ? 'active' : ''}"
                    onClick=${() => setSelectedPersona(key)}
                  >
                    <span class="persona-card-emoji">${config.emoji}</span>
                    <span>${i18n.personas[key]}</span>
                  </button>
                `)}
              </div>
            </div>

            <!-- Language Section -->
            <div class="sidebar-section">
              <div class="section-heading">${i18n.language}</div>
              <select
                id="language-select"
                class="language-dropdown"
                value=${selectedLanguage}
                onChange=${e => setSelectedLanguage(e.target.value)}
              >
                ${Object.entries(LANG_OPTIONS).map(([key, label]) => html`
                  <option key=${key} value=${key}>${label}</option>
                `)}
              </select>
            </div>

            <!-- Sidebar Weather Widget -->
            <div class="sidebar-weather-widget" id="sidebar-weather-widget">
              ${isLoadingWeather ? html`
                <div>
                  <div class="skeleton-block skel-temp"></div>
                  <div class="skeleton-block skel-cond"></div>
                  <div class="skeleton-block skel-stats"></div>
                  <div class="skeleton-block skel-sun"></div>
                </div>
              ` : weather ? html`
                <div class="widget-temp-row">
                  <div class="widget-temp-large">${weather.temp}°</div>
                  <div class="widget-temp-feels">${i18n.feelsLike} ${weather.feelsLike}°</div>
                </div>
                <div class="widget-condition-text">
                  <span>${getWeatherEmoji(weather.condition)}</span>
                  <span>${weather.condition}</span>
                </div>
                <div class="widget-stats-grid">
                  <div class="widget-stat-box">
                    <div class="stat-val">💧 ${weather.humidity}%</div>
                    <div class="stat-lbl">${i18n.humidity}</div>
                  </div>
                  <div class="widget-stat-box">
                    <div class="stat-val">💨 ${weather.windSpeed}</div>
                    <div class="stat-lbl">${i18n.wind}</div>
                  </div>
                  <div class="widget-stat-box">
                    <div class="stat-val">☀️ ${weather.uvIndex}</div>
                    <div class="stat-lbl">${i18n.uv}</div>
                  </div>
                </div>
                ${forecast.daily?.length > 0 && html`
                  <div class="widget-sun-row">
                    <span>🌅 ${formatClockTime(forecast.daily[0]?.sunriseTime)} (${i18n.sunrise})</span>
                    <span>🌇 ${formatClockTime(forecast.daily[0]?.sunsetTime)} (${i18n.sunset})</span>
                  </div>
                `}
                <div class="widget-footer-row">
                  <span>${lastUpdatedTime ? getElapsedTimeLabel(lastUpdatedTime, selectedLanguage) : i18n.updated}</span>
                  <button
                    id="refresh-weather-btn"
                    class="widget-refresh-btn ${isLoadingWeather ? 'spinning' : ''}"
                    onClick=${() => fetchWeatherData(currentLoc.lat, currentLoc.lng, currentLoc.city)}
                    title="Refresh Live Weather"
                  >
                    <span class="spin-icon">🔄</span> ${i18n.refresh}
                  </button>
                </div>
                <div class="auto-refresh-countdown">
                  ${i18n.autoRefreshPrefix}${countdownMinutes}:${countdownSeconds}
                </div>
              ` : html`
                <div class="weather-unavailable-msg">
                  Weather data unavailable
                </div>
              `}
            </div>
          </aside>

          <!-- MAIN VIEWPORT -->
          <main class="main-viewport" id="main-viewport">
            <!-- Top Alert Banner -->
            ${activeAlert && !alertBannerDismissed && html`
              <div class="alert-banner ${activeAlert.level}" id="alert-banner">
                <div class="alert-text-group">
                  <span>${activeAlert.text}</span>
                </div>
                <button
                  class="alert-close-btn"
                  onClick=${() => setAlertBannerDismissed(true)}
                  title="Dismiss alert"
                >✕</button>
              </div>
            `}

            <!-- Main Header Bar -->
            <header class="main-header">
              <div class="header-left-info">
                <h1 class="header-city-title">
                  <span>${weather ? getWeatherEmoji(weather.condition) : '📍'}</span>
                  <span>${currentLoc.city}</span>
                  ${currentLoc.isGps && html`<span class="header-gps-pill">📍 Live GPS</span>`}
                  ${weather && html`<span class="header-condition-pill">· ${weather.condition}</span>`}
                </h1>
              </div>
              <div class="header-actions-group">
                <button
                  id="compare-mode-btn"
                  class="header-btn ${isCompareOpen ? 'active' : ''}"
                  onClick=${() => setIsCompareOpen(true)}
                  title="Compare two Indian cities"
                >
                  ${i18n.compare}
                </button>
                <button
                  id="clear-chat-btn"
                  class="header-btn"
                  onClick=${handleClearConversation}
                  title="Clear Chat History"
                >
                  ${i18n.clear}
                </button>
              </div>
            </header>

            <!-- Chat Messages Scroll Area -->
            <div class="chat-scroll-area ${backgroundTint}" id="chat-scroll-area">
              ${messages.length === 0 ? html`
                <!-- Welcome State -->
                <div class="welcome-container">
                  <div class="welcome-badge">${i18n.welcomeBadge}</div>
                  <h2 class="welcome-title">${i18n.welcomeTitle}</h2>
                  <p class="welcome-subtitle">
                    <strong>${currentLoc.city}</strong> ${i18n.welcomeSubtitle}
                  </p>
                  <div class="welcome-cards-grid">
                    ${i18n.starters.map((card, idx) => html`
                      <div
                        key=${idx}
                        id="welcome-card-${idx}"
                        class="welcome-example-card"
                        onClick=${() => {
                          setSelectedPersona(card.personaKey);
                          handleSendMessage(card.q);
                        }}
                      >
                        <div class="welcome-card-top">
                          <span class="welcome-card-icon">${card.emoji}</span>
                          <span class="welcome-persona-tag">${card.title}</span>
                        </div>
                        <div class="welcome-q-text">"${card.q}"</div>
                        <div class="welcome-a-text">${card.a}</div>
                      </div>
                    `)}
                  </div>
                </div>
              ` : html`
                <!-- Message Bubbles List -->
                ${messages.map(msg => html`
                  <div key=${msg.id} class="message-row ${msg.role === 'user' ? 'user' : 'ai'}">
                    <div class="message-content-wrapper">
                      <div class="message-bubble">${msg.content}</div>
                      
                      <div class="message-meta-row">
                        <span>${msg.time}</span>
                      </div>

                      ${msg.role === 'assistant' ? html`
                        <div class="assistant-extras-wrap">
                          <div class="message-actions-row">
                            <button
                              class="msg-action-chip"
                              onClick=${() => handleToggleListen(msg)}
                              title="Listen (TTS)"
                            >
                              ${activeSpeakingId === msg.id ? i18n.stop : i18n.listen}
                            </button>
                            <button
                              class="msg-action-chip"
                              onClick=${() => handleCopyText(msg)}
                              title="Copy message"
                            >
                              ${i18n.copy}
                            </button>
                            <button
                              class="msg-action-chip"
                              onClick=${() => handleToggleTranslate(msg)}
                              title="Translate to English"
                            >
                              ${i18n.translate}
                            </button>
                            <button
                              class="msg-action-chip"
                              onClick=${() => handleShareWeather(msg)}
                              title="Share formatted weather"
                            >
                              ${i18n.share}
                            </button>
                          </div>

                          ${translatedMap[msg.id] ? html`
                            <div class="translation-box">
                              <div class="translation-header">🇬🇧 English Translation:</div>
                              <div class="translation-text">${translatedMap[msg.id]}</div>
                            </div>
                          ` : null}
                        </div>
                      ` : null}
                    </div>
                  </div>
                `)}
              `}

              <!-- Typing Indicator -->
              ${isTyping && html`
                <div class="typing-indicator-row">
                  <div class="typing-pill">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                  </div>
                  <span class="typing-label">${i18n.thinking}</span>
                </div>
              `}

              <div ref=${chatBottomRef} />
            </div>

            <!-- Quick Suggestion Chips (Localized to Native Script) -->
            <div class="quick-chips-wrapper" id="quick-chips-wrapper">
              ${(i18n.chips[selectedPersona] || []).map((chip, idx) => html`
                <button
                  key=${chip}
                  id="quick-chip-${idx}"
                  class="quick-chip-btn"
                  onClick=${() => handleSendMessage(chip)}
                >
                  ${chip}
                </button>
              `)}
            </div>

            <!-- Chat Input Bar -->
            <div class="chat-input-bar">
              <div class="input-inner-wrapper">
                <textarea
                  ref=${inputAreaRef}
                  id="chat-textarea"
                  class="message-textarea"
                  placeholder=${i18n.inputPlaceholder}
                  rows="1"
                  maxLength="200"
                  value=${textInput}
                  onInput=${handleTextareaInput}
                  onKeyDown=${handleInputKeyDown}
                  disabled=${isSending}
                ></textarea>
                <span class="char-limit-indicator ${textInput.length >= 180 ? 'danger' : ''}">
                  ${textInput.length}/200
                </span>
              </div>
              
              <!-- Microphone Voice Button -->
              <button
                id="mic-voice-btn"
                class="icon-round-btn mic-record-btn ${micStatus}"
                onClick=${handleToggleMicrophone}
                title="Voice Input (Press Ctrl+M)"
              >
                ${micStatus === 'recording' ? '🔴' : micStatus === 'processing' ? '⏳' : '🎤'}
              </button>

              <!-- Send Button -->
              <button
                id="send-message-btn"
                class="icon-round-btn send-msg-btn"
                onClick=${() => handleSendMessage(textInput)}
                disabled=${isSending || !textInput.trim()}
                title="Send Message"
              >
                ${isSending ? '⏳' : '➤'}
              </button>
            </div>

            <!-- Forecast Panels Toggle Bar -->
            <div class="forecast-toggles-bar">
              <button
                id="toggle-7day-forecast"
                class="toggle-forecast-btn ${showSevenDay ? 'active' : ''}"
                onClick=${() => { setShowSevenDay(!showSevenDay); setShowTwentyFourHr(false); }}
              >
                ${i18n.forecast7} ${showSevenDay ? '▲' : '▼'}
              </button>
              <button
                id="toggle-24hr-forecast"
                class="toggle-forecast-btn ${showTwentyFourHr ? 'active' : ''}"
                onClick=${() => { setShowTwentyFourHr(!showTwentyFourHr); setShowSevenDay(false); }}
              >
                ${i18n.forecast24} ${showTwentyFourHr ? '▲' : '▼'}
              </button>
            </div>

            <!-- 7-Day Forecast Panel -->
            ${showSevenDay && forecast.daily?.length > 0 && html`
              <div class="forecast-slider-container" id="panel-7day-forecast">
                ${forecast.daily.map((day, idx) => {
                  const rainClass = day.precipProb > 60 ? 'high' : day.precipProb > 30 ? 'med' : 'low';
                  const fillWidth = `${Math.max(day.precipProb, 4)}%`;
                  return html`
                    <div key=${idx} class="daily-forecast-card">
                      <div class="daily-day-label">${formatDayLabel(day.date, idx, selectedLanguage)}</div>
                      <div class="daily-emoji-icon">${getWeatherEmoji(day.condition)}</div>
                      <div class="daily-temp-row">
                        <span>${day.maxTemp}°</span>
                        <span class="daily-min-temp">/${day.minTemp}°</span>
                      </div>
                      <div class="rain-bar-track">
                        <div class="rain-bar-fill ${rainClass}" style=${{ width: fillWidth }}></div>
                      </div>
                      <div class="daily-subtext">💧 ${day.precipProb}% ${i18n.rainChance}</div>
                      <div class="daily-subtext">💨 ${day.maxWindSpeed} km/h</div>
                      ${day.sunriseTime && html`
                        <div class="daily-subtext">🌅 ${formatClockTime(day.sunriseTime)}</div>
                      `}
                    </div>
                  `;
                })}
              </div>
            `}

            <!-- 24-Hour Forecast Panel -->
            ${showTwentyFourHr && forecast.hourly?.length > 0 && html`
              <div class="forecast-slider-container" id="panel-24hr-forecast">
                ${forecast.hourly.map((h, idx) => html`
                  <div key=${idx} class="hourly-forecast-card">
                    <div class="hourly-time-label">${formatHourLabel(h.time)}</div>
                    <div class="hourly-emoji-icon">${getWeatherEmoji(h.condition)}</div>
                    <div class="hourly-temp-label">${h.temp}°</div>
                    <div class="hourly-rain-label">💧 ${h.precipProb}%</div>
                  </div>
                `)}
              </div>
            `}
          </main>

          <!-- Compare Mode Modal -->
          ${isCompareOpen && html`
            <div
              class="compare-backdrop"
              id="compare-modal-backdrop"
              onClick=${(e) => e.target.id === 'compare-modal-backdrop' && setIsCompareOpen(false)}
            >
              <div class="compare-modal-box">
                <div class="compare-modal-header">
                  <h2 class="compare-modal-title">${i18n.compareTitle}</h2>
                  <button class="compare-modal-close" onClick=${() => setIsCompareOpen(false)}>✕</button>
                </div>
                <div class="compare-cities-grid">
                  <!-- City 1 -->
                  <div class="compare-card">
                    <div class="compare-card-title">📍 ${currentLoc.city} (${i18n.compareCityCurrent})</div>
                    ${weather ? html`
                      <div class="compare-metric-row"><span class="metric-label">${i18n.feelsLike}</span><span class="metric-value">${weather.temp}°C</span></div>
                      <div class="compare-metric-row"><span class="metric-label">${i18n.humidity}</span><span class="metric-value">${weather.humidity}%</span></div>
                      <div class="compare-metric-row"><span class="metric-label">${i18n.wind}</span><span class="metric-value">${weather.windSpeed} km/h (${weather.windDirection})</span></div>
                      <div class="compare-metric-row"><span class="metric-label">${i18n.uv}</span><span class="metric-value">${weather.uvIndex}</span></div>
                      <div class="compare-metric-row"><span class="metric-label">Visibility</span><span class="metric-value">${weather.visibility} km</span></div>
                    ` : html`<p>Loading weather data...</p>`}
                  </div>

                  <!-- City 2 -->
                  <div class="compare-card">
                    <div class="compare-card-title">🔍 ${i18n.compareCitySecond}</div>
                    <div class="compare-search-row">
                      <input
                        id="compare-input"
                        class="compare-search-input"
                        type="text"
                        placeholder=${i18n.compareInputPlaceholder}
                        value=${compareCityQuery}
                        onInput=${e => setCompareCityQuery(e.target.value)}
                        onKeyDown=${e => e.key === 'Enter' && handleFetchCompareCity(compareCityQuery)}
                      />
                      <button
                        id="compare-submit-btn"
                        class="compare-submit-btn"
                        onClick=${() => handleFetchCompareCity(compareCityQuery)}
                        disabled=${isCompareLoading}
                      >
                        ${isCompareLoading ? '⏳' : i18n.compareBtn}
                      </button>
                    </div>

                    <!-- Quick Compare Chips -->
                    <div class="compare-quick-chips">
                      ${['Mumbai', 'Chennai', 'Kolkata', 'Bengaluru', 'Hyderabad', 'Jaipur'].map(c => html`
                        <button
                          key=${c}
                          class="compare-quick-chip"
                          onClick=${() => {
                            setCompareCityQuery(c);
                            handleFetchCompareCity(c);
                          }}
                        >
                          ${c}
                        </button>
                      `)}
                    </div>

                    ${isCompareLoading ? html`
                      <p class="compare-loading-text">Fetching meteorological data...</p>
                    ` : compareWeatherData ? html`
                      <div class="compare-metric-row"><span class="metric-label">City</span><span class="metric-value">${compareWeatherData.city}</span></div>
                      <div class="compare-metric-row"><span class="metric-label">${i18n.feelsLike}</span><span class="metric-value">${compareWeatherData.temp}°C</span></div>
                      <div class="compare-metric-row"><span class="metric-label">${i18n.humidity}</span><span class="metric-value">${compareWeatherData.humidity}%</span></div>
                      <div class="compare-metric-row"><span class="metric-label">${i18n.wind}</span><span class="metric-value">${compareWeatherData.windSpeed} km/h (${compareWeatherData.windDirection})</span></div>
                      <div class="compare-metric-row"><span class="metric-label">${i18n.uv}</span><span class="metric-value">${compareWeatherData.uvIndex}</span></div>
                      <div class="compare-metric-row"><span class="metric-label">Visibility</span><span class="metric-value">${compareWeatherData.visibility} km</span></div>
                    ` : html`
                      <p class="compare-hint-text">
                        Type any Indian city name and click Compare or select a preset above.
                      </p>
                    `}
                  </div>
                </div>
              </div>
            </div>
          `}

          <!-- Settings Modal -->
          ${isSettingsOpen && html`
            <div
              class="compare-backdrop"
              id="settings-modal-backdrop"
              onClick=${(e) => e.target.id === 'settings-modal-backdrop' && setIsSettingsOpen(false)}
            >
              <div class="settings-modal-box">
                <div class="compare-modal-header">
                  <h2 class="compare-modal-title">⚙️ AI Model & API Configuration</h2>
                  <button class="compare-modal-close" onClick=${() => setIsSettingsOpen(false)}>✕</button>
                </div>
                <p class="settings-desc">
                  Connect any real LLM provider for live, 100% dynamic conversational responses in native Indian scripts. If no key is set, WeatherGPT uses our high-fidelity local intent engine.
                </p>

                <label class="settings-label">Google Gemini API Key (Recommended)</label>
                <input
                  type="password"
                  class="settings-input"
                  placeholder="AIzaSy..."
                  value=${geminiKeyInput}
                  onInput=${e => setGeminiKeyInput(e.target.value)}
                />

                <label class="settings-label">Anthropic Claude API Key</label>
                <input
                  type="password"
                  class="settings-input"
                  placeholder="sk-ant-..."
                  value=${claudeKeyInput}
                  onInput=${e => setClaudeKeyInput(e.target.value)}
                />

                <label class="settings-label">OpenAI / Groq API Key</label>
                <input
                  type="password"
                  class="settings-input"
                  placeholder="sk-..."
                  value=${openaiKeyInput}
                  onInput=${e => setOpenaiKeyInput(e.target.value)}
                />

                <div class="settings-actions">
                  <button class="header-btn" onClick=${() => setIsSettingsOpen(false)}>Cancel</button>
                  <button
                    class="header-btn active"
                    onClick=${() => {
                      const cKey = claudeKeyInput.trim();
                      const gKey = geminiKeyInput.trim();
                      const oKey = openaiKeyInput.trim();

                      CONFIG.CLAUDE_API_KEY = cKey;
                      CONFIG.GEMINI_API_KEY = gKey;
                      CONFIG.OPENAI_API_KEY = oKey;

                      localStorage.setItem('weathergpt_claude_key', cKey);
                      localStorage.setItem('weathergpt_gemini_key', gKey);
                      localStorage.setItem('weathergpt_openai_key', oKey);

                      setIsSettingsOpen(false);
                      if (gKey || cKey || oKey) {
                        showToast('✅ Live AI Model activated!');
                      } else {
                        showToast('ℹ️ Local intelligent engine active.');
                      }
                    }}
                  >
                    Save & Activate
                  </button>
                </div>
              </div>
            </div>
          `}

          <!-- Floating Toast Notification -->
          ${toastMsg && html`
            <div class="toast-notification">
              <span>${toastMsg}</span>
            </div>
          `}
        </div>
      `;
    }

    // Error Boundary Component
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error('WeatherGPT UI Error:', error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return html`
            <div style=${{ padding: '40px 20px', textAlign: 'center', fontFamily: 'Inter, sans-serif' }}>
              <h2 style=${{ color: '#C62828' }}>⚠️ Something went wrong</h2>
              <p style=${{ color: '#546E7A', margin: '12px 0 24px' }}>${this.state.error?.message || 'An unexpected error occurred.'}</p>
              <button
                class="header-btn active"
                onClick=${() => window.location.reload()}
              >
                Reload WeatherGPT
              </button>
            </div>
          `;
        }
        return this.props.children;
      }
    }

    // Mount Application
    const appMountElement = document.getElementById('root');
    const reactRoot = createRoot(appMountElement);
    reactRoot.render(React.createElement(ErrorBoundary, null, React.createElement(WeatherGptApp)));
  </script>
</body>
</html>
